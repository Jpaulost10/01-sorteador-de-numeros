<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Dev Sorteio</title>
</head>

<body>
    <img src="./imagens/sort 1.png" alt="sorteio-img">
    <div>
        <p>Sortear um número</p>
        <input id="inicial-number" type="number" placeholder="Entre">
        <input id="final-number" type="number" placeholder="E">
        <br>
        <button class="sorteio">Sortear</button>
        <br>
        <p class="result" aria-live="polite"></p>
        <br>
        <button class="restart" hidden>Reiniciar</button>

    </div>

    <script src="./script.js"></script>
</body>

</html>
